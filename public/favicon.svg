<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="boldA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="lightV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064E3B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean Rounded Square Badge with Emerald Ring & Shadow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shieldGrad)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>

  <g>
    <!-- Letter V (Not bold / Lighter weight, background layer) -->
    <path d="M 16 13 L 23 13 L 32 37 L 41 13 L 48 13 L 36 51 L 28 51 Z" fill="url(#lightV)"/>

    <!-- Letter A (Bold / Heavy weight, foreground layer) -->
    <path d="M 32 7 L 51 53 L 42 53 L 37.5 41 L 26.5 41 L 22 53 L 13 53 Z M 32 20 L 35.5 31 L 28.5 31 Z" fill="url(#boldA)"/>

    <!-- Central Sparkling Vedic Bindu / Star -->
    <circle cx="32" cy="28" r="2.5" fill="#FBBF24"/>
    <circle cx="32" cy="28" r="4.5" fill="#FDE68A" fill-opacity="0.5"/>
  </g>
</svg>
