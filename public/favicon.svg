<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1206"/>
      <stop offset="50%" stop-color="#4A1C07"/>
      <stop offset="100%" stop-color="#1A0A03"/>
    </linearGradient>
    <linearGradient id="goldA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="amberV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Jewel Shield -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="1.75"/>
  <rect x="4" y="4" width="56" height="56" rx="11" fill="none" stroke="#FDE68A" stroke-width="0.5" stroke-opacity="0.4"/>
  
  <g filter="url(#glow)">
    <!-- Letter A (Pointing Up) -->
    <path d="M 32 8.5 L 51 53.5 L 42 53.5 L 37.5 42 L 26.5 42 L 22 53.5 L 13 53.5 Z M 32 23.5 L 35.2 34 L 28.8 34 Z" fill="url(#goldA)"/>
    
    <!-- Letter V (Pointing Down, Superimposed) -->
    <path d="M 13 10.5 L 22 10.5 L 32 39.5 L 42 10.5 L 51 10.5 L 36 53.5 L 28 53.5 Z" fill="url(#amberV)" fill-opacity="0.9" style="mix-blend-mode: screen;"/>
    
    <!-- Central Overlap Accent Star -->
    <circle cx="32" cy="31" r="2.2" fill="#FFFFFF"/>
    <circle cx="32" cy="31" r="4" fill="#FDE047" fill-opacity="0.4"/>
  </g>
</svg>
